<html lang="fr">
<head>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--bg:#05070d;--txt:#f6f9ff;--dim:rgba(235,242,255,.62);
--acc:#5ad100;--acc2:#0aa7f5;--pink:#ff4b8b;--warn:#ff9600;--bad:#ff4b4b;
--glass:rgba(255,255,255,.09);
--glass2:rgba(255,255,255,.055);
--stroke:rgba(255,255,255,.16);
--stroke2:rgba(255,255,255,.09);
--r:26px;--rs:18px;
--shadow:0 18px 44px rgba(0,0,0,.42), inset 0 1px 0 rgba(255,255,255,.30);
}
html,body{margin:0;height:100%;background:var(--bg)}
body{
color:var(--txt);
font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
letter-spacing:-.011em;
padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased;
}
body::before{
content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
background:
 radial-gradient(42% 34% at 16% 6%, rgba(90,209,0,.38), transparent 68%),
 radial-gradient(40% 30% at 84% 10%, rgba(10,167,245,.36), transparent 68%),
 radial-gradient(48% 38% at 50% 98%, rgba(180,90,255,.30), transparent 70%),
 radial-gradient(34% 26% at 92% 62%, rgba(255,90,150,.20), transparent 70%);
filter:blur(46px) saturate(140%);
}
body::after{
content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(130% 90% at 50% 0%,transparent 38%,rgba(0,0,0,.62) 100%);
}
#app{max-width:520px;margin:0 auto;padding:18px 16px 104px;min-height:100vh}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.028em}
h1{font-size:27px;font-weight:800}
h2{font-size:20px;font-weight:750}
h3{font-size:11.5px;color:var(--dim);font-weight:700;text-transform:uppercase;letter-spacing:.10em}
p{margin:0}
.muted{color:var(--dim)}
.small{font-size:13px}.tiny{font-size:11px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.stack>*+*{margin-top:12px}
.spacer{height:12px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

.card{
background:linear-gradient(158deg,rgba(255,255,255,.14),rgba(255,255,255,.045) 55%,rgba(255,255,255,.075));
border:1px solid var(--stroke);border-radius:var(--r);padding:17px;
-webkit-backdrop-filter:blur(26px) saturate(180%);
backdrop-filter:blur(26px) saturate(180%);

}
.btn{
display:block;width:100%;padding:17px;border-radius:20px;
background:linear-gradient(180deg,#86ec3a 0%,#55c400 55%,#46ab00 100%);
color:#05260a;font-weight:800;font-size:16.5px;letter-spacing:-.01em;text-align:center;
box-shadow:0 12px 26px rgba(85,196,0,.38), inset 0 1px 0 rgba(255,255,255,.60), inset 0 -2px 0 rgba(0,0,0,.14);
transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:active{transform:scale(.975);box-shadow:0 5px 14px rgba(85,196,0,.30), inset 0 1px 0 rgba(255,255,255,.5)}
.btn.alt{
background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));

border:1px solid var(--stroke);
box-shadow:0 10px 26px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.28);
-webkit-backdrop-filter:blur(20px) saturate(170%);
backdrop-filter:blur(20px) saturate(170%);
}
.btn.blue{
background:linear-gradient(180deg,#5ecbff,#0aa7f5 60%,#0789c9);
color:#03212f;
box-shadow:0 12px 26px rgba(10,167,245,.35), inset 0 1px 0 rgba(255,255,255,.55);
}
.btn.ghost{background:transparent;box-shadow:none;color:var(--dim);font-weight:600;padding:10px}
.btn:disabled{opacity:.42;box-shadow:none;transform:none;filter:saturate(.6)}
.pill{
display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:700;
background:linear-gradient(160deg,rgba(255,255,255,.17),rgba(255,255,255,.06));
border:1px solid var(--stroke);
box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 6px 16px rgba(0,0,0,.22);
-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);
}
.bar{height:9px;border-radius:99px;background:rgba(0,0,0,.42);overflow:hidden;
border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 1px 3px rgba(0,0,0,.55)}
.bar>i{display:block;height:100%;border-radius:99px;
background:linear-gradient(90deg,#7ef03a,#4fc000);box-shadow:0 0 12px rgba(110,230,40,.55);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.ring{
--p:0;width:80px;height:80px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;position:relative;
background:conic-gradient(from -90deg,#8bf23c calc(var(--p)*1%),rgba(255,255,255,.10) 0);
box-shadow:0 0 22px rgba(110,230,40,.30), inset 0 1px 0 rgba(255,255,255,.4);
}
.ring::after{content:"";position:absolute;inset:8px;border-radius:50%;
background:linear-gradient(160deg,rgba(20,28,44,.96),rgba(8,12,22,.98));
box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.ring span{position:relative;z-index:1;font-weight:800;font-size:16px;letter-spacing:-.03em}
.stat{
background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
border:1px solid var(--stroke2);border-radius:20px;padding:13px;text-align:center;
-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 10px 24px rgba(0,0,0,.28);
}
.stat b{display:block;font-size:21px;line-height:1.15;letter-spacing:-.03em}
.stat i{font-style:normal;font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.lvl{
display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:15px;border-radius:22px;
background:linear-gradient(158deg,rgba(255,255,255,.13),rgba(255,255,255,.04));
border:1px solid var(--stroke2);
box-shadow:inset 0 1px 0 rgba(255,255,255,.24), 0 12px 28px rgba(0,0,0,.30);

.lvl:active{transform:scale(.982);border-color:rgba(255,255,255,.3)}
.lvl .ico{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:22px;flex:0 0 auto;

.lvl .meta{flex:1;min-width:0}
.lvl .meta b{font-size:16px;letter-spacing:-.02em}
.lvl .meta .bar{margin-top:8px}
.cardq{
background:linear-gradient(158deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
border:1px solid var(--stroke);border-radius:22px;padding:16px;
-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
box-shadow:inset 0 1px 0 rgba(255,255,255,.26), 0 14px 32px rgba(0,0,0,.32);
}
.choice{
display:block;width:100%;text-align:left;padding:16px;border-radius:18px;margin-top:10px;
font-weight:650;font-size:15.5px;letter-spacing:-.01em;
background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
border:1.5px solid var(--stroke2);
box-shadow:inset 0 1px 0 rgba(255,255,255,.20), 0 8px 20px rgba(0,0,0,.22);
transition:transform .10s ease,border-color .10s ease,background .10s ease;
}
.choice:active{transform:scale(.985)}
.choice.ok{border-color:rgba(120,230,60,.85);background:linear-gradient(160deg,rgba(90,209,0,.28),rgba(90,209,0,.10));
box-shadow:0 0 0 1px rgba(120,230,60,.35), inset 0 1px 0 rgba(255,255,255,.25)}
.choice.no{border-color:rgba(255,90,90,.8);background:linear-gradient(160deg,rgba(255,70,70,.26),rgba(255,70,70,.08))}
.choice .k{display:inline-block;min-width:22px;color:var(--dim);font-weight:800}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.back{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;font-size:18px;
background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.05));
border:1px solid var(--stroke);
box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 8px 18px rgba(0,0,0,.28);
-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
}
.bigword{font-size:36px;font-weight:800;letter-spacing:-.035em;margin:6px 0}
.bigq{font-size:26px;font-weight:800;letter-spacing:-.03em;margin:4px 0}
.phon{color:#6fd3ff;font-weight:700;font-size:15px;letter-spacing:-.01em}
.ex{color:var(--dim);font-size:14px;font-style:italic;margin-top:10px;border-left:3px solid rgba(255,255,255,.18);padding-left:11px}
input[type=text],input[type=password]{
width:100%;padding:16px;border-radius:18px;color:var(--txt);font-size:17px;outline:none;
background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(0,0,0,.18));
border:1.5px solid var(--stroke2);
box-shadow:inset 0 2px 8px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.10);
-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
transition:border-color .15s ease, box-shadow .15s ease;
}
input:focus{border-color:rgba(10,167,245,.85);box-shadow:inset 0 2px 8px rgba(0,0,0,.35),0 0 0 3px rgba(10,167,245,.18)}
.feed{position:fixed;left:0;right:0;bottom:0;z-index:9;
padding:16px 16px calc(16px + env(safe-area-inset-bottom));
background:linear-gradient(180deg,rgba(5,7,13,0),rgba(5,7,13,.72) 45%,rgba(5,7,13,.94) 100%);
-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.feed>div{max-width:520px;margin:0 auto}
.toast{
position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(16px) scale(.96);opacity:0;
padding:13px 20px;border-radius:18px;font-weight:700;font-size:14px;z-index:20;pointer-events:none;
background:linear-gradient(160deg,rgba(70,180,40,.55),rgba(30,90,20,.55));
border:1px solid rgba(160,255,120,.45);color:#eaffdc;text-align:center;max-width:88vw;
-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
box-shadow:0 16px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.35);
transition:opacity .22s ease, transform .22s cubic-bezier(.2,.9,.3,1.2);
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.bars{display:flex;align-items:flex-end;gap:8px;height:92px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars i{display:block;width:100%;border-radius:7px 7px 0 0;min-height:4px;
background:linear-gradient(180deg,#8bf23c,#3fa800);box-shadow:0 0 12px rgba(110,230,40,.35)}
.bars span{font-size:10px;color:var(--dim)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avs button{font-size:25px;padding:9px 0;border-radius:15px;
background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
border:1.5px solid var(--stroke2);
box-shadow:inset 0 1px 0 rgba(255,255,255,.22), 0 6px 16px rgba(0,0,0,.22);
transition:transform .1s ease,border-color .1s ease}
.avs button:active{transform:scale(.92)}
.avs button.sel{border-color:rgba(120,230,60,.9);background:linear-gradient(160deg,rgba(90,209,0,.30),rgba(90,209,0,.10));
box-shadow:0 0 0 1px rgba(120,230,60,.35), inset 0 1px 0 rgba(255,255,255,.3), 0 8px 20px rgba(90,209,0,.25)}
.tabs{display:flex;gap:8px;margin-bottom:14px;padding:5px;border-radius:18px;
background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
border:1px solid var(--stroke2);
-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tab{flex:1;padding:10px;border-radius:14px;font-weight:700;font-size:14px;text-align:center;color:var(--dim);
transition:background .18s ease,color .18s ease,box-shadow .18s ease}
.tab.on{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.12));color:#fff;
box-shadow:0 4px 12px rgba(0,0,0,.30), inset 0 1px 0 rgba(255,255,255,.4)}
.formula{background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.10);border-radius:14px;
padding:11px 13px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;color:#9ff26a;
margin-top:6px;box-shadow:inset 0 2px 8px rgba(0,0,0,.4)}
.corr{color:#9ff26a;font-weight:700}
.v-present{color:#7ef03a;font-weight:800}
.v-past{color:#5ecbff;font-weight:800}
.v-fut{color:#ffb03a;font-weight:800}
.v-imp{color:#c98bff;font-weight:800}
.tense{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:800;margin-top:11px}
.forms{font-size:14px;color:rgba(230,240,255,.88);margin-top:3px;line-height:1.55}
.qline{background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
border:1px solid var(--stroke2);border-radius:18px;padding:13px;margin-top:9px}
.qline b{font-size:15px}
.qline .fr{color:var(--dim);font-size:13px;margin-top:2px}
hr{border:0;border-top:1px solid rgba(255,255,255,.10);margin:16px 0}

.fb{margin-top:13px;padding:14px 15px;border-radius:16px;font-weight:700;font-size:14.5px;line-height:1.5;
-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.fb.ok{background:rgba(90,209,0,.15);border:1px solid rgba(120,230,60,.42);color:#c9ffa8}
.fb.no{background:rgba(255,70,70,.13);border:1px solid rgba(255,90,90,.42);color:#ffc9c9}
.fb.no b{color:#ff6b6b}
.fb.ok b{color:#9dff6b}

.karaoke{font-size:30px;font-weight:800;letter-spacing:-.01em;color:#5ecbff;text-shadow:0 0 18px rgba(94,203,255,.35)}
.kbar{height:5px;border-radius:99px;background:rgba(255,255,255,.10);overflow:hidden;margin-top:10px}
.kbar>i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#5ecbff,#8fe3ff);box-shadow:0 0 12px rgba(94,203,255,.6)}


.speaking{color:#5ecbff !important;font-weight:800 !important;text-shadow:0 0 18px rgba(94,203,255,.45);transition:color .15s}

.chat{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.bubble{max-width:88%;padding:12px 14px;border-radius:18px;font-size:15px;line-height:1.45}
.bubble.them{align-self:flex-start;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16)}
.bubble.me{align-self:flex-end;background:linear-gradient(160deg,rgba(90,209,0,.28),rgba(90,209,0,.12));border:1px solid rgba(120,230,60,.35)}
.bubble .tr{display:block;margin-top:5px;font-size:12px;color:#93a4bf}
.bubble.typing{opacity:.6;font-style:italic}
.tr-out{margin-top:12px;padding:14px;border-radius:16px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);font-size:16px;line-height:1.5}
textarea{width:100%;min-height:110px;padding:14px;border-radius:16px;color:#eef3fb;font:inherit;font-size:16px;
background:linear-gradient(160deg,rgba(255,255,255,.10),rgba(0,0,0,.18));border:1.5px solid rgba(255,255,255,.12);outline:none}


.bubble.speaking{border-color:rgba(94,203,255,.75);box-shadow:0 0 0 2px rgba(94,203,255,.25)}
.bubble.speaking .txt{color:#5ecbff;font-weight:800}


.places{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px}

.place b{display:block;font-size:19px;font-weight:800}
.place span{display:block;font-size:7px;color:#93a4bf;text-transform:uppercase;letter-spacing:0;line-height:1.2;margin-top:4px}
.place.hi{border-color:rgba(94,203,255,.6);background:rgba(94,203,255,.12)}
.place.hi b{color:#5ecbff}

</style>

<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<script>
const DATA = __DATA__;
const CONJ = __CONJ__;
const QUEST = __QUEST__;
const LEX = __LEX__;
const CONV = __CONV__;
const GRAM = __GRAM__;
const VERSION = "__BUILD__";
const LEVELS = {
  A1:{name:"Débutant",sub:"A1 · survie",emoji:"🌱",color:"#58cc02"},
  A2:{name:"Élémentaire",sub:"A2 · quotidien",emoji:"🌿",color:"#1cb0f6"},
  B1:{name:"Intermédiaire",sub:"B1 · aisance",emoji:"🌳",color:"#ce82ff"},
  B2:{name:"Avancé",sub:"B2 · précision",emoji:"🔥",color:"#ff9600"},
  KIDS:{name:"Enfant",sub:"Jeux & images",emoji:"🧒",color:"#ff4b8b"}
};
const BOX_DAYS=[0,1,2,4,7,15,30,60];
const GOAL_XP=50, GOAL_MIN=10;
const AVATARS=["🐧","🦊","🐼","🦉","🐙","🦁","🐸","🐨","🦄","🐺","🦖","🦕","🐉","🦦","🦥","🦔","🐢","🦩","🦚","🐳","🦈","🦋","🐝","🦜"];

/* ---------- state ---------- */
const KEY="espanol_v1";
function blank(){return{profile:null,xp:0,streak:0,best:0,last:null,minutes:0,good:0,bad:0,items:{},history:{},created:Date.now()}}
let S=load();
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));return r&&r.items?r:blank()}catch(e){return blank()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const today=()=>new Date().toISOString().slice(0,10);
const dayNum=d=>Math.round(new Date(d+"T12:00:00").getTime()/864e5);

function touchDay(){
  const t=today();
  if(S.last===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak = S.last===y ? S.streak+1 : 1;
  S.best=Math.max(S.best||0,S.streak);
  S.last=t; save();
}
function itm(l,i){
  const k=l+":"+i;
  if(!S.items[k])S.items[k]={b:0,d:0,r:0,w:0,n:0};
  return S.items[k];
}
function dueCount(lvl){
  const t=dayNum(today());let n=0;
  DATA[lvl].forEach((_,i)=>{const it=itm(lvl,i);if(it.n>0&&it.d<=t)n++});
  return n;
}
function levelPct(lvl){
  const arr=DATA[lvl];let s=0;
  arr.forEach((_,i)=>{const it=itm(lvl,i);s+=Math.min(1,it.b/3)});
  return Math.round(100*s/arr.length);
}
function duePct(ok,n){
  if(!ok)return 0;
  return 100*S.good/(S.good+S.bad||1);
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
function el(html){const d=document.createElement("div");d.innerHTML=html.trim();return d.firstElementChild}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1900)}
function karaokeRun(txt,rate){
  const b=document.getElementById("kf");
  if(!b)return;
  const ms=Math.max(650,((txt||"").length*95+380)/(rate||1));
  b.style.transition="none"; b.style.width="0%"; void b.offsetWidth;
  b.style.transition="width "+Math.round(ms)+"ms linear";
  b.style.width="100%";
}
function highlightSpeaking(txt,rate){
  try{
    const first=String(txt||"").split(" . ")[0].trim();
    if(!first)return;
    const nodes=Array.from(document.querySelectorAll("#app b, #app .bigword, #app .karaoke, #app .choice, #app p, #app .ex, #app .fr, #app .bubble .txt, #app .bubble"));
    let best=null;
    for(const el of nodes){
      if(el.querySelector("b,div,p,span"))continue;
      const t=(el.textContent||"").trim();
      if(!t)continue;
      const match = (t===first) || t.startsWith(first) || (t.length>3 && first.startsWith(t));
      if(match && (!best || t.length < best.textContent.trim().length)) best=el;
    }
    if(!best)return;
    document.querySelectorAll(".speaking").forEach(e=>e.classList.remove("speaking"));
    best.classList.add("speaking");
    const ms=Math.max(800, (String(first).length*95+400)/(rate||0.9));
    setTimeout(()=>best.classList.remove("speaking"), ms);
  }catch(e){}
}

async function speakViaGateway(txt,rate,onstart){
  try{
    const cfg=(typeof chatCfg==="function")?chatCfg():null;
    if(!cfg||!cfg.url||!cfg.tok)return false;
    const base=cfg.url.replace(/\/chat$/,"");
    const key=base+"|"+TR_LANG+"|"+(rate||1)+"|"+txt;
    let url=TTS_CACHE[key];
    if(!url){
      const ctl=new AbortController();
      const tmo=setTimeout(()=>ctl.abort(),4500);
      let r;
      try{
        r=await fetch(base+"/tts",{method:"POST",signal:ctl.signal,
          headers:{"Content-Type":"application/json","x-langchat-token":cfg.tok},
          body:JSON.stringify({text:txt,lang:TR_LANG,rate:rate||1})});
      } finally { clearTimeout(tmo); }
      if(!r.ok)return false;
      const b=await r.blob();
      url=URL.createObjectURL(b);
      const ks=Object.keys(TTS_CACHE);
      if(ks.length>=25){ try{URL.revokeObjectURL(TTS_CACHE[ks[0]])}catch(e){} delete TTS_CACHE[ks[0]]; }
      TTS_CACHE[key]=url;
    }
    if(!TTS_AUDIO) TTS_AUDIO=new Audio();
    try{TTS_AUDIO.pause()}catch(e){}
    TTS_AUDIO.src=url;
    TTS_AUDIO.volume=1;
    await TTS_AUDIO.play();
    if(onstart)onstart();
    return true;
  }catch(e){ return false; }
}
function speak(txt,rate){
  try{
    const start=()=>{ highlightSpeaking(txt,rate); karaokeRun(txt,rate||.9); };
    speakViaGateway(txt,rate,start).then(ok=>{ if(!ok){ start(); speakLocal(txt,rate); } });
    return;
  }catch(e){}

function speakLocal(txt,rate){
  try{
    if(!window.speechSynthesis)return;
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang="es-ES"; u.rate=rate||.9; u.pitch=1.05; u.volume=1;
    const vs=speechSynthesis.getVoices().filter(v=>/^es/i.test(v.lang||""));
    const pref=vs.find(v=>/enhanced|premium|siri|neural/i.test(v.name)) || vs[0];
    if(pref)u.voice=pref;

}

const TOKKEY="espanol_gh_token";

function mergeState(a,b){
  const out=JSON.parse(JSON.stringify(a||{}));
  b=b||{};
  out.xp=Math.max(a.xp||0,b.xp||0);
  out.streak=Math.max(a.streak||0,b.streak||0);
  out.best=Math.max(a.best||0,b.best||0);
  out.minutes=Math.max(a.minutes||0,b.minutes||0);
  out.good=Math.max(a.good||0,b.good||0);
  out.bad=Math.max(a.bad||0,b.bad||0);
  out.last=[a.last||"",b.last||""].sort().pop();
  out.items=Object.assign({},b.items||{});
  Object.keys(a.items||{}).forEach(k=>{
    const v=a.items[k],o=out.items[k];
    if(!o)out.items[k]=v;
    else out.items[k]={b:Math.max(o.b||0,v.b||0),d:Math.max(o.d||0,v.d||0),r:Math.max(o.r||0,v.r||0),w:Math.max(o.w||0,v.w||0),n:Math.max(o.n||0,v.n||0)};
  });
  out.history=Object.assign({},b.history||{});
  Object.keys(a.history||{}).forEach(k=>{
    const v=a.history[k]||{},o=out.history[k]||{};
    out.history[k]={xp:Math.max(v.xp||0,o.xp||0),m:Math.max(v.m||0,o.m||0)};
  });
  out.profile=a.profile||b.profile||null;
  out.created=Math.min(a.created||Date.now(),b.created||Date.now());
  out.gistId=a.gistId||b.gistId;
  return out;
}
async function ghSync(){
  const t=tok();
  if(!t){toast("Ajoute d'abord un token GitHub");return}
  const base="https://api.github.com";
  const h={Authorization:"Bearer "+t,Accept:"application/vnd.github+json","Content-Type":"application/json"};
  try{
    if(S.gistId){
      const r=await fetch(base+"/gists/"+S.gistId,{headers:h});
      if(r.ok){
        const g=await r.json();
        const f=g.files&&g.files["espanol-progress.json"];
        if(f&&f.content){try{S=mergeState(S,JSON.parse(f.content))}catch(e){}}
      }
    }
    const payload=JSON.stringify({description:"Espagnol — progression (privé)",public:false,files:{"espanol-progress.json":{content:JSON.stringify(S)}}});
    const r2=S.gistId
      ? await fetch(base+"/gists/"+S.gistId,{method:"PATCH",headers:h,body:payload})
      : await fetch(base+"/gists",{method:"POST",headers:h,body:payload});
    if(!r2.ok)throw new Error("HTTP "+r2.status);
    const g2=await r2.json();
    S.gistId=g2.id;S.synced=Date.now();save();
    toast("Synchronisé ✓");render();
  }catch(e){toast("Échec : "+e.message)}
}

function pick(lvl,rev){
  const t=dayNum(today());
  let pool=[];
  DATA[lvl].forEach((w,i)=>{
    const it=itm(lvl,i);
    const isDue=it.n>0&&it.d<=t;
    if(rev&&!isDue)return;
    let score=it.b*100 + it.n*10 + (isDue?-50:0) + Math.random()*20;
    if(it.n===0)score=it.b*100+Math.random()*20;
    pool.push({i,w,it,score});
  });
  pool.sort((x,y)=>x.score-y.score);
  return pool.slice(0,8);
}
function distract(lvl,w){
  const c=DATA[lvl].filter(x=>x.f!==w.f);
  const out=[];
  while(out.length<3&&c.length){
    const p=c.splice(Math.floor(Math.random()*c.length),1)[0];
    if(!out.find(o=>o.f===p.f))out.push(p);
  }
  return out;
}

function startLesson(lvl,rev,listen){
  const src=lvl||S.profile.level;
  let picks;
  if(rev){
    picks=[];
    Object.keys(DATA).forEach(l=>{
      const p=pick(l,true);
      p.forEach(x=>picks.push({...x,lvl:l}));
    });
    picks.sort((a,b)=>a.score-b.score);
    picks=picks.slice(0,8);
  } else {
    picks=pick(src,false).map(x=>({...x,lvl:src}));
  }
  if(!picks.length){toast("Rien à réviser ici 🎉");return}
  LSN={src,rev,listen:!!listen,picks,idx:0,phase:"card",good:0,bad:0,start:Date.now(),typing:[]};
  LSN.typing=picks.slice(0,2).map(p=>p.w);
  go("lesson");
}

function newConjQ(){
  const vi=Math.floor(Math.random()*CONJ.length);
  const v=CONJ[vi];
  const tenses=Object.keys(v.t).filter(t=>v.t[t][0]&&v.t[t][0]!=="—");
  const t=tenses[Math.floor(Math.random()*tenses.length)];
  const len=Math.min(6,v.t[t].length);
  const p=Math.floor(Math.random()*len);
  const good=v.t[t][p];
  const pool=[];
  CONJ.forEach(o=>Object.keys(o.t).forEach(tt=>o.t[tt].forEach(f=>{
    if(f&&f!=="—"&&f!==good)pool.push(f);
  })));
  const opts=[good];
  while(opts.length<4&&pool.length){
    const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    if(opts.indexOf(x)<0)opts.push(x);
  }
  opts.sort(()=>Math.random()-.5);
  S._cs.q={vi,t,p,good,opts};
}

/* ---------- traduction ---------- */
const TR_LANG="es";
function normTxt(t){
  return String(t||"").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function looksFrench(t){
  const fr=["le","la","les","des","une","un","est","et","je","tu","il","nous","vous","pour","avec","dans","que","pas","sur"];
  const w=normTxt(t).split(" ");
  return w.filter(x=>fr.includes(x)).length >= Math.max(2, w.length*0.12);
}
function localTranslate(txt, toFr){
  const words=normTxt(txt).split(" ").filter(Boolean);
  const dict={};
  Object.keys(DATA).forEach(l=>DATA[l].forEach(w=>{
    dict[normTxt(w.e)]=w.f; dict[normTxt(w.f)]=w.e;
  }));
  if(typeof LEX!=="undefined"&&LEX&&LEX.categories)LEX.categories.forEach(c=>c.items.forEach(w=>{
    dict[normTxt(w.e)]=w.f; dict[normTxt(w.f)]=w.e;
  }));
  const out=words.map(w=>dict[w]||w);
  return out.join(" ")+"  ⚠︎ (traduction locale, mot à mot)";
}
async function doTranslate(){
  const src=$("#tin").value.trim();
  if(!src){toast("Écris un texte");return}
  const out=$("#tout"); out.textContent="…";
  const toFr=looksFrench(src);
  const pair = toFr ? (TR_LANG+"|fr") : ("fr|"+TR_LANG);
  try{
    const r=await fetch("https://api.mymemory.translated.net/get?q="+encodeURIComponent(src)+"&langpair="+pair);
    const j=await r.json();
    const t=j&&j.responseData&&j.responseData.translatedText;
    if(!t||/MYMEMORY WARNING|QUERY LENGTH LIMIT/i.test(t)) throw new Error("quota");
    out.textContent=t;
    S._trLast=t;
  }catch(e){
    out.textContent=localTranslate(src,toFr);
    S._trLast=out.textContent;
  }
  const b=$("#tsay"); if(b)b.style.display="inline-flex";
}
function translateScreen(a){
  a.innerHTML=`<div class="top"><button class="back" onclick="go('home')">‹</button><h2>Traduire</h2><span style="width:40px"></span></div>

}
function renderConvo(){
  const a=$("#app");
  const c=CONV[S._cvi]; if(!c)return go("convo");
  const upto=S._cvl;
  const bubbles=c.lines.slice(0,upto+1).map((l,i)=>`
    <div class="bubble ${i%2===0?"them":"me"}">${esc(l.s)}<span class="tr">${esc(l.f)}</span></div>`).join("");
  const expected=c.lines[upto+1];
  a.innerHTML=`<div class="top"><button class="back" onclick="go('convo')">‹</button><h2>${c.e} ${esc(c.t)}</h2><span style="width:40px"></span></div>
  <div class="chat">${bubbles}</div>
  ${expected?`<div class="spacer"></div>
  <div class="cardq"><div class="tiny muted">À toi — dis ou écris :</div>
    <div style="margin-top:6px;font-size:15px;color:#93a4bf">${esc(expected.f)}</div></div>
  <div class="spacer"></div>
  <input id="cin" type="text" placeholder="ta réplique en ${TR_LANG.toUpperCase()}…" autocomplete="off" autocorrect="off" spellcheck="false">
  <div style="height:10px"></div>
  <div class="grid2"><button class="btn" id="csend">Envoyer</button><button class="btn alt" id="cskip">Voir la réponse</button></div>
  <div class="spacer"></div>
  <button class="btn alt" id="cmic">🎤 Parler</button>`:`
  <div class="spacer"></div><button class="btn" onclick="go('convo')">Terminé ✓</button>`}`;
  if(!expected)return;
  const check=()=>{
    const v=$("#cin").value.trim(); if(!v)return;
    const sim=similarity(v, expected.s);
    if(sim>=0.6){
      toast("✓ Bien joué");
      S._cvl+=2; if(S._cvl>=c.lines.length-1)S._cvl=c.lines.length-1;
      renderConvo();
      setTimeout(()=>{const l=c.lines[Math.min(S._cvl,c.lines.length-1)]; if(l)speak(l.s)},300);
    } else {
      toast("Pas encore — regarde la réponse");
      S._cvl+=2; if(S._cvl>=c.lines.length-1)S._cvl=c.lines.length-1;
      renderConvo();
    }
  };
  $("#csend").onclick=check;
  $("#cin").onkeydown=e=>{if(e.key==="Enter")check()};
  $("#cskip").onclick=()=>{ S._cvl+=2; if(S._cvl>=c.lines.length-1)S._cvl=c.lines.length-1; renderConvo(); };
  const mic=$("#cmic");
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ mic.textContent="🎤 Non disponible sur ce navigateur"; mic.disabled=true; }
  else mic.onclick=()=>{
    const r=new SR(); r.lang=TR_LANG==="en"?"en-US":"es-ES"; r.interimResults=false; r.maxAlternatives=1;
    mic.textContent="🎤 Écoute…";
    r.onresult=ev=>{ const t=ev.results[0][0].transcript; $("#cin").value=t; mic.textContent="🎤 Parler"; check(); };
    r.onerror=()=>{ mic.textContent="🎤 Parler"; toast("Micro indisponible"); };
    r.onend=()=>{ mic.textContent="🎤 Parler"; };
    try{r.start()}catch(e){mic.textContent="🎤 Parler"}
  };
}
function similarity(a,b){
  const A=normTxt(a).split(" ").filter(Boolean), B=normTxt(b).split(" ").filter(Boolean);
  if(!A.length||!B.length)return 0;
  let hit=0; const pool=B.slice();
  A.forEach(w=>{const i=pool.indexOf(w); if(i>=0){hit++;pool.splice(i,1)}});
  return hit/Math.max(A.length,B.length);
}

function newGramQ(){
  const r=GRAM[Math.floor(Math.random()*GRAM.length)];
  const good=r.ex[0].s;
  const pool=[];
  GRAM.forEach(o=>o.wrong.forEach(w=>{if(w.s!==good)pool.push(w)}));
  const picks=[];
  while(picks.length<3&&pool.length){
    const x=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
    if(picks.find(p=>p.s===x.s))continue;
    picks.push(x);
  }
  const opts=[{s:good,why:""},...picks].sort(()=>Math.random()-.5);
  const correct=opts.findIndex(o=>o.s===good);
  S._gq.q={rule:r.t,opts:opts.map(o=>o.s),correct,why:picks.length?picks[0].why:""};
}

    <div class="stat"><b>${mastered}</b><i>maîtrisés</i></div>
  </div>
  <div class="spacer"></div>
  <div class="card">
    <h3>7 derniers jours</h3>
    <div class="bars" style="margin-top:12px">
      ${days.map(x=>`<div><i style="height:${Math.max(4,100*x.m/max)}%"></i><span>${["D","L","M","M","J","V","S"][new Date(x.d+"T12:00:00").getDay()]}</span></div>`).join("")}
    </div>
    <p class="tiny muted" style="margin-top:8px">minutes d'étude par jour</p>
  </div>
  <div class="spacer"></div>
  <h3>Par niveau</h3><div class="spacer"></div>
  <div class="stack">${Object.entries(LEVELS).map(([k,L])=>`
    <div class="card">
      <div class="between"><b>${L.emoji} ${L.name}</b><span class="tiny muted">${levelPct(k)}%</span></div>
      <div class="bar" style="margin-top:8px"><i style="width:${levelPct(k)}%;background:${L.color}"></i></div>
    </div>`).join("")}</div>`;
}

/* ---------- profile ---------- */
function profile(a){
  const p=S.profile;
  a.innerHTML=`
  <div class="top"><button class="back" onclick="go('home')">‹</button><h2>Profil</h2><span style="width:38px"></span></div>
  <div class="card" style="text-align:center">
    <div style="font-size:56px">${p.avatar}</div>
    <h2 style="margin-top:6px">${esc(p.name)}</h2>
    <p class="small muted">Depuis le ${new Date(p.since).toLocaleDateString("fr-FR")}</p>
    <div class="spacer"></div>
    <button class="btn alt" id="ren">✏️ Changer le prénom</button>
    <div class="spacer"></div>
    <div class="grid3">
      <div class="stat"><b>${S.xp}</b><i>xp</i></div>
      <div class="stat"><b>${S.streak}</b><i>série</i></div>
      <div class="stat"><b>${levelPct(p.level||"A1")}%</b><i>niveau</i></div>
    </div>
  </div>
  <div class="spacer"></div>
  <div class="card">
    <h3>Niveau</h3><div class="spacer"></div>
    <div class="stack">${Object.entries(LEVELS).map(([k,L])=>`
      <button class="choice" data-l="${k}" style="${k===(p.level||"A1")?"border-color:var(--acc)":""}">
        ${L.emoji} ${L.name} <span class="muted small">· ${L.sub}</span></button>`).join("")}</div>
  </div>
  <div class="spacer"></div>
  <div class="card">
    <h3>Synchronisation</h3>
    <p class="tiny muted" style="margin-top:4px">Même progression sur ton iPhone et ton PC, via un Gist GitHub privé.</p>
    <div class="spacer"></div>
    <input id="tk" type="password" placeholder="Token GitHub (droits : gist)" value="${tok()?"••••••••••":""}">
    <div style="height:10px"></div>
    <button class="btn blue" id="sy">🔄 Synchroniser</button>
    <div style="height:10px"></div>
    <button class="btn alt" id="imp">⬆️ Importer un fichier</button>
    <input id="fi" type="file" accept="application/json" style="display:none">
    <p class="tiny muted" style="margin-top:10px">${S.synced?"Dernière synchro : "+new Date(S.synced).toLocaleString("fr-FR"):"Jamais synchronisé"}</p>
  </div>
  <div class="spacer"></div>
  <div class="card">
    <h3>Réglages</h3><div class="spacer"></div>
    <button class="btn blue" id="clr">🧹 Vider le cache et recharger</button>
    <div style="height:10px"></div>
    <button class="btn alt" id="exp">⬇️ Exporter mes données</button>
    <div style="height:10px"></div>
    <button class="btn alt" id="rst" style="color:#ff9a9a">♻️ Tout réinitialiser</button>
  </div>
  <p class="tiny muted" style="text-align:center;margin-top:16px">v${VERSION} · build 2026-10-28 · données stockées sur ton téléphone</p>`;
  a.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{p.level=b.dataset.l;save();toast("Niveau : "+LEVELS[b.dataset.l].name);render()});
  $("#sy").onclick=()=>{const v=$("#tk").value.trim();if(v&&v.indexOf("•")!==0)localStorage.setItem(TOKKEY,v);ghSync()};
  $("#imp").onclick=()=>$("#fi").click();
  $("#fi").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const o=JSON.parse(rd.result);S=mergeState(S,o);save();toast("Importé ✓");render()}catch(err){toast("Fichier invalide")}};rd.readAsText(f)};
  $("#ren").onclick=()=>{const v=prompt("Ton prénom",p.name);if(v&&v.trim()){p.name=v.trim().slice(0,18);save();render()}};
  $("#clr").onclick=async()=>{
    try{const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister()}catch(e){}
    try{const ks=await caches.keys();await Promise.all(ks.map(k=>caches.delete(k)))}catch(e){}
    location.reload();
  };
  $("#exp").onclick=()=>{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
    const u=URL.createObjectURL(blob);const i=document.createElement("a");
    i.href=u;i.download="espanol-progress.json";i.click();URL.revokeObjectURL(u);
  };
  $("#rst").onclick=()=>{
    if(confirm("Effacer toute la progression ?")){localStorage.removeItem(KEY);S=blank();location.reload()}
  };
}

/* ---------- boot ---------- */
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
if(window.speechSynthesis)speechSynthesis.onvoiceschanged=()=>{};
render();startMinuteClock();
</script>
</body>
</html>
