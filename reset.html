<!DOCTYPE html>
<html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nettoyage — Anglais</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05070d;color:#eef3fb;
font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
.box{max-width:420px}
h1{font-size:22px;margin:0 0 10px}
p{color:#93a4bf;margin:0 0 18px}
a{display:inline-block;padding:14px 22px;border-radius:16px;background:#5ad100;color:#05260a;
font-weight:800;text-decoration:none}
.ok{color:#9fe870;font-weight:700}
</style></head>
<body><div class="box">
<h1>Nettoyage de l'application</h1>
<p id="msg">Suppression du cache et du service worker…</p>
<a id="go" href="./index.html" style="display:none">Ouvrir l'application</a>
</div>
<script>
(async function(){
  var msg=document.getElementById('msg');
  try{
    if('serviceWorker' in navigator){
      var rs=await navigator.serviceWorker.getRegistrations();
      for(var i=0;i<rs.length;i++){ await rs[i].unregister(); }
    }
  }catch(e){}
  try{
    if(window.caches){ var ks=await caches.keys(); await Promise.all(ks.map(function(k){return caches.delete(k)})); }
  }catch(e){}
  msg.innerHTML='<span class="ok">Cache vidé.</span> La progression est conservée.';
  document.getElementById('go').style.display='inline-block';
  setTimeout(function(){ location.replace('./index.html'); },1600);
})();
</script></body></html>
